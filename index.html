<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d16" />
  <title>ডেইলি সাজেশন • SR7 Mods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    .ambient-bg {
      background-image:
        radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.11), transparent 36%),
        radial-gradient(circle at 85% 20%, rgba(20, 184, 166, 0.11), transparent 38%),
        radial-gradient(circle at 50% 90%, rgba(99, 102, 241, 0.08), transparent 45%);
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      box-shadow: 0 24px 60px -15px rgba(0, 0, 0, 0.65);
    }
    .glass-subcard {
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.13);
    }

    /* Native swipe carousel */
    .swipe-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      gap: 16px;
      padding: 4px 2px 8px;
    }
    .swipe-track::-webkit-scrollbar { display: none; }
    .swipe-card {
      flex: 0 0 100%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.45s ease both; }

    @keyframes shimmer {
      0%   { opacity: 0.45; }
      50%  { opacity: 0.85; }
      100% { opacity: 0.45; }
    }
    .skeleton { animation: shimmer 1.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .swipe-track { scroll-behavior: auto; }
      .fade-up, .skeleton { animation: none; }
    }
  </style>
</head>
<body class="ambient-bg min-h-screen flex flex-col justify-between selection:bg-amber-500/30 selection:text-amber-200">
  <!-- Header -->
  <header class="w-full max-w-6xl mx-auto px-4 sm:px-6 pt-5 pb-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg shadow-amber-500/20">
        স
      </div>
      <div>
        <p class="text-xs uppercase tracking-wider text-amber-400/90 font-semibold">
          অনার্স প্রস্তুতি
        </p>
        <h1 class="text-lg sm:text-xl font-bold text-slate-100 leading-tight">
          ডেইলি সাজেশন
        </h1>
      </div>
    </div>

    <span
      id="counter"
      class="hidden px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold bg-slate-800/90 text-slate-200 border border-slate-700/80"
    ></span>
  </header>

  <!-- Progress -->
  <div class="w-full max-w-6xl mx-auto px-4 sm:px-6 mb-3">
    <div class="w-full h-1.5 bg-slate-800/90 rounded-full overflow-hidden">
      <div
        id="progressBar"
        class="h-full bg-gradient-to-r from-amber-400 via-orange-400 to-teal-400 rounded-full transition-all duration-300"
        style="width: 0%;"
      ></div>
    </div>
  </div>

  <!-- Main -->
  <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-2 flex flex-col justify-center">
    <section id="stage" aria-live="polite">
      <!-- Loading skeleton -->
      <div id="loading" class="glass-panel rounded-3xl p-6 sm:p-10 min-h-[380px] skeleton">
        <div class="h-5 w-32 rounded-full bg-slate-700/70"></div>
        <div class="h-9 w-3/4 rounded-xl bg-slate-700/70 mt-5"></div>
        <div class="h-4 w-full rounded bg-slate-700/50 mt-6"></div>
        <div class="h-4 w-5/6 rounded bg-slate-700/50 mt-2.5"></div>
        <div class="h-11 w-44 rounded-xl bg-slate-700/70 mt-10"></div>
      </div>

      <!-- Swipe track -->
      <div id="track" class="swipe-track hidden" tabindex="0" aria-label="সাজেশন তালিকা, সোয়াইপ করুন"></div>

      <!-- Empty / error state -->
      <div id="message" class="hidden glass-panel rounded-3xl p-8 sm:p-12 min-h-[380px] flex-col items-center justify-center text-center">
        <div class="h-14 w-14 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl">📭</div>
        <h2 id="messageTitle" class="mt-4 text-xl sm:text-2xl font-bold text-white"></h2>
        <p id="messageBody" class="mt-2 text-sm sm:text-base text-slate-300 max-w-md"></p>
        <button
          id="retryBtn"
          type="button"
          class="mt-6 px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition cursor-pointer"
        >
          আবার চেষ্টা করুন
        </button>
      </div>
    </section>

    <!-- Controls -->
    <nav id="controls" aria-label="নেভিগেশন" class="hidden mt-4 flex-col sm:flex-row items-center justify-between gap-3 pb-2">
      <div class="flex items-center gap-2">
        <button
          id="prevBtn"
          type="button"
          class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none text-slate-100 border border-slate-700 transition cursor-pointer"
        >
          ← আগের
        </button>
        <button
          id="nextBtn"
          type="button"
          class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 disabled:opacity-40 disabled:pointer-events-none text-slate-950 shadow-lg shadow-amber-500/20 transition cursor-pointer"
        >
          পরের →
        </button>
      </div>

      <div id="dots" class="flex items-center gap-1.5 flex-wrap justify-center"></div>

      <p class="text-xs text-slate-400 text-center">
        <span class="md:hidden">← সোয়াইপ করুন →</span>
        <span class="hidden md:inline">কীবোর্ড শর্টকাট: <span class="text-slate-200 font-medium">←</span> ও <span class="text-slate-200 font-medium">→</span></span>
      </p>
    </nav>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-6xl mx-auto px-4 sm:px-6 py-3 text-center sm:text-left text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-1">
    <span>Made with ❤️ for friends of Bangla Department. ✌🏻</span>
    <a
      href="https://sr7mods.github.io/about-dev/"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-1.5 py-1.5 px-1 font-medium text-amber-300/90 hover:text-amber-200 underline decoration-amber-400/40 underline-offset-4 hover:decoration-amber-300 transition"
    >Collected and Coded by SR7 Mods <span aria-hidden="true">↗</span></a>
  </footer>

  <script>
    /**
     * Daily Suggestions — auto-discovering index
     * -------------------------------------------------
     * Repo-র যেকোনো .html ফাইল (index.html ছাড়া) খুঁজে বের করে,
     * ফাইলের <title> দিয়ে একটা কার্ড বানায়।
     *
     * Ignore করতে চাইলে:  IGNORE-এ ফাইলের নাম যোগ করো,
     * অথবা ফাইলের নাম _ (underscore) দিয়ে শুরু করো।
     */
    const FALLBACK_OWNER = 'sr7mods';
    const FALLBACK_REPO = 'Daily-Suggestions';
    const BRANCHES = ['main', 'master'];
    const IGNORE = ['index.html', '404.html'];
    const LIST_CACHE_KEY = 'ds:list:v1';
    const LIST_CACHE_MAX_AGE = 1000 * 60 * 5; // ৫ মিনিট

    // GitHub Pages URL থেকে owner/repo অটো ধরে (sr7mods.github.io/Daily-Suggestions/)
    function detectRepo() {
      const host = location.hostname;
      if (host.endsWith('.github.io')) {
        const owner = host.split('.')[0];
        const repo = location.pathname.split('/').filter(Boolean)[0];
        if (owner && repo) return { owner, repo };
      }
      return { owner: FALLBACK_OWNER, repo: FALLBACK_REPO };
    }
    const { owner: OWNER, repo: REPO } = detectRepo();

    const ACCENTS = [
      {
        chip: 'bg-amber-500/15 text-amber-300 border-amber-400/30',
        num: 'text-amber-400/15',
        btn: 'from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 shadow-amber-500/20',
        glow: 'from-amber-500/10',
        dot: 'bg-amber-400',
      },
      {
        chip: 'bg-teal-500/15 text-teal-300 border-teal-400/30',
        num: 'text-teal-400/15',
        btn: 'from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 shadow-teal-500/20',
        glow: 'from-teal-500/10',
        dot: 'bg-teal-400',
      },
      {
        chip: 'bg-indigo-500/15 text-indigo-300 border-indigo-400/30',
        num: 'text-indigo-400/15',
        btn: 'from-indigo-500 to-violet-500 hover:from-indigo-400 hover:to-violet-400 shadow-indigo-500/20',
        glow: 'from-indigo-500/10',
        dot: 'bg-indigo-400',
      },
    ];

    const $ = (id) => document.getElementById(id);
    const loadingEl = $('loading');
    const trackEl = $('track');
    const messageEl = $('message');
    const controlsEl = $('controls');
    const dotsEl = $('dots');
    const counterEl = $('counter');
    const progressEl = $('progressBar');
    const prevBtn = $('prevBtn');
    const nextBtn = $('nextBtn');

    const STEP = () => (trackEl.clientWidth || 1) + 16; // card width + gap

    let items = [];
    let activeIndex = 0;

    const toBn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);

    function safeGet(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    }

    function prettyFromPath(path) {
      const name = path.split('/').pop().replace(/\.html?$/i, '');
      return decodeURIComponent(name).replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
    }

    // ---------- 1) Repo থেকে HTML ফাইলের তালিকা ----------
    async function fetchTree() {
      let lastErr = null;
      for (const branch of BRANCHES) {
        try {
          const res = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${branch}?recursive=1`,
            { headers: { Accept: 'application/vnd.github+json' } }
          );
          if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
          const data = await res.json();
          return (data.tree || [])
            .filter((n) => n.type === 'blob' && /\.html?$/i.test(n.path))
            .filter((n) => {
              const base = n.path.split('/').pop().toLowerCase();
              return !IGNORE.includes(base) && !base.startsWith('_') && n.path.toLowerCase() !== 'index.html';
            })
            .map((n) => ({ path: n.path, sha: n.sha }));
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Tree fetch failed');
    }

    // ---------- 2) প্রতিটি ফাইলের <title> ও description ----------
    async function resolveMeta(file) {
      const cacheKey = 'ds:meta:' + file.sha;
      const cached = safeGet(cacheKey);
      if (cached) return { ...file, ...cached };

      try {
        const res = await fetch(encodeURI(file.path), { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const title = (doc.querySelector('title')?.textContent || '').trim();
        const desc = (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '').trim();
        const meta = { title: title || prettyFromPath(file.path), desc };
        safeSet(cacheKey, meta);
        return { ...file, ...meta };
      } catch (e) {
        return { ...file, title: prettyFromPath(file.path), desc: '' };
      }
    }

    // ---------- 3) Render ----------
    function show(which) {
      loadingEl.classList.toggle('hidden', which !== 'loading');
      trackEl.classList.toggle('hidden', which !== 'list');
      controlsEl.classList.toggle('hidden', which !== 'list');
      controlsEl.classList.toggle('flex', which === 'list');
      messageEl.classList.toggle('hidden', which !== 'message');
      messageEl.classList.toggle('flex', which === 'message');
      counterEl.classList.toggle('hidden', which !== 'list');
      if (which !== 'list') progressEl.style.width = '0%';
    }

    function showMessage(title, body) {
      $('messageTitle').textContent = title;
      $('messageBody').textContent = body;
      show('message');
    }

    function buildCard(item, i) {
      const a = ACCENTS[i % ACCENTS.length];
      const card = document.createElement('article');
      card.className = 'swipe-card';

      const panel = document.createElement('div');
      panel.className = `glass-panel relative overflow-hidden rounded-3xl p-6 sm:p-10 min-h-[380px] flex flex-col justify-between fade-up bg-gradient-to-br ${a.glow} to-transparent`;

      const bigNum = document.createElement('span');
      bigNum.className = `pointer-events-none select-none absolute -right-2 -top-6 sm:-top-10 text-[9rem] sm:text-[13rem] font-bold leading-none ${a.num}`;
      bigNum.setAttribute('aria-hidden', 'true');
      bigNum.textContent = toBn(String(i + 1).padStart(2, '0'));

      const top = document.createElement('div');
      top.className = 'relative';

      const chip = document.createElement('span');
      chip.className = `inline-block px-3 py-1 rounded-full text-xs font-semibold border ${a.chip}`;
      chip.textContent = `সাজেশন ${toBn(i + 1)}`;

      const h2 = document.createElement('h2');
      h2.className = 'mt-4 text-2xl sm:text-4xl md:text-5xl font-bold text-white tracking-tight leading-snug break-words';
      h2.textContent = item.title;

      const p = document.createElement('p');
      p.className = 'mt-3 text-sm sm:text-base text-slate-300 leading-relaxed max-w-2xl';
      p.textContent = item.desc || 'ট্যাপ করে পুরো সাজেশনটি স্লাইড আকারে দেখুন।';

      top.append(chip, h2, p);

      const bottom = document.createElement('div');
      bottom.className = 'relative mt-8 flex flex-wrap items-center justify-between gap-3';

      const link = document.createElement('a');
      link.href = encodeURI(item.path);
      link.className = `inline-flex items-center gap-2 px-6 py-3 rounded-xl text-sm sm:text-base font-semibold bg-gradient-to-r ${a.btn} text-slate-950 shadow-lg transition`;
      link.textContent = 'সাজেশন খুলুন ';
      const arrow = document.createElement('span');
      arrow.setAttribute('aria-hidden', 'true');
      arrow.textContent = '→';
      link.appendChild(arrow);

      const file = document.createElement('span');
      file.className = 'text-xs text-slate-500 font-mono break-all';
      file.textContent = item.path;

      bottom.append(link, file);
      panel.append(bigNum, top, bottom);
      card.appendChild(panel);
      return card;
    }

    function renderList(list, keepIndex) {
      items = list;
      trackEl.innerHTML = '';
      items.forEach((it, i) => trackEl.appendChild(buildCard(it, i)));

      dotsEl.innerHTML = '';
      items.forEach((it, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', `সাজেশন ${i + 1}: ${it.title}`);
        b.dataset.index = i;
        b.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(b);
      });

      show('list');
      const target = Math.min(keepIndex || 0, items.length - 1);
      trackEl.style.scrollBehavior = 'auto';
      trackEl.scrollLeft = target * STEP();
      requestAnimationFrame(() => { trackEl.style.scrollBehavior = ''; });
      activeIndex = target;
      updateUI();
    }

    function updateUI() {
      const total = items.length;
      counterEl.textContent = `${toBn(activeIndex + 1)} / ${toBn(total)}`;
      progressEl.style.width = `${((activeIndex + 1) / total) * 100}%`;
      prevBtn.disabled = activeIndex === 0;
      nextBtn.disabled = activeIndex === total - 1;

      dotsEl.querySelectorAll('button').forEach((b, i) => {
        const active = i === activeIndex;
        const dot = ACCENTS[i % ACCENTS.length].dot;
        b.className = `h-2.5 rounded-full transition-all cursor-pointer ${active ? 'w-7 ' + dot : 'w-2.5 bg-slate-600 hover:bg-slate-500'}`;
      });
    }

    function goTo(i) {
      const clamped = Math.max(0, Math.min(items.length - 1, i));
      trackEl.scrollTo({ left: clamped * STEP(), behavior: 'smooth' });
    }

    // Swipe/scroll হলে active index আপডেট
    let ticking = false;
    trackEl.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const idx = Math.round(trackEl.scrollLeft / STEP());
        const safe = Math.max(0, Math.min(items.length - 1, idx));
        if (safe !== activeIndex) { activeIndex = safe; updateUI(); }
      });
    }, { passive: true });

    window.addEventListener('resize', () => {
      if (!items.length) return;
      trackEl.style.scrollBehavior = 'auto';
      trackEl.scrollLeft = activeIndex * STEP();
      requestAnimationFrame(() => { trackEl.style.scrollBehavior = ''; });
    });

    prevBtn.addEventListener('click', () => goTo(activeIndex - 1));
    nextBtn.addEventListener('click', () => goTo(activeIndex + 1));
    document.addEventListener('keydown', (e) => {
      if (!items.length) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(activeIndex + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(activeIndex - 1); }
    });
    const safeInit = () => init().catch(() => showMessage('তালিকা লোড করা যায়নি', 'কিছু একটা সমস্যা হয়েছে। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।'));
    $('retryBtn').addEventListener('click', safeInit);

    // ---------- 4) Boot ----------
    function sortFiles(list) {
      return list.slice().sort((a, b) =>
        a.path.localeCompare(b.path, 'en', { numeric: true, sensitivity: 'base' })
      );
    }

    async function loadAndRender(files, keepIndex) {
      const resolved = await Promise.all(sortFiles(files).map(resolveMeta));
      renderList(resolved, keepIndex);
    }

    async function init() {
      show('loading');
      const cached = safeGet(LIST_CACHE_KEY);
      const fresh = cached && Date.now() - cached.t < LIST_CACHE_MAX_AGE;

      // ক্যাশ থাকলে সাথে সাথে দেখাও
      if (cached && cached.files && cached.files.length) {
        await loadAndRender(cached.files, 0);
        if (fresh) return;
      }

      try {
        const files = await fetchTree();
        safeSet(LIST_CACHE_KEY, { t: Date.now(), files });
        const same =
          cached && cached.files &&
          JSON.stringify(sortFiles(cached.files)) === JSON.stringify(sortFiles(files));
        if (!same) {
          if (!files.length) {
            showMessage('এখনো কোনো সাজেশন যুক্ত করা হয়নি।', '');
          } else {
            await loadAndRender(files, activeIndex);
          }
        }
      } catch (err) {
        if (!(cached && cached.files && cached.files.length)) {
          showMessage('তালিকা লোড করা যায়নি', 'ইন্টারনেট বা GitHub API লিমিটের কারণে হতে পারে। একটু পরে আবার চেষ্টা করুন।');
        }
      }
    }

    safeInit();
  </script>
</body>
</html>
