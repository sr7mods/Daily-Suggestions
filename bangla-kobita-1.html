      if (e.key === 'ArrowRight' || e.key === ' ') {
        if (currentIndex < slides.length - 1) {
          e.preventDefault();
          currentIndex += 1;
          renderSlide(currentIndex);
        }
      } else if (e.key === 'ArrowLeft') {
        if (currentIndex > 0) {
          e.preventDefault();
          currentIndex -= 1;
          renderSlide(currentIndex);
        }
      }
    });

    // Initial render
    renderSlide(currentIndex);
  </script>
</body>
</html>
