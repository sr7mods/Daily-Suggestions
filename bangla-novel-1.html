    }

    function renderDots() {
      dotContainerEl.innerHTML = slides
        .map((s, idx) => {
          const active = idx === currentIndex;
          return `
            <button
              type="button"
              data-index="${idx}"
              aria-label="স্লাইড ${idx + 1}: ${s.title}"
              class="h-2.5 rounded-full transition-all cursor-pointer ${
                active ? 'w-7 bg-amber-400' : 'w-2.5 bg-slate-600 hover:bg-slate-500'
              }"
            ></button>
          `;
        })
        .join('');

      dotContainerEl.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentIndex = Number(btn.dataset.index);
          renderSlide(currentIndex);
        });
      });
    }

    function renderOverviewGrid() {
      overviewGridEl.innerHTML = slides
        .map(
          (s, idx) => `
          <button
            type="button"
            data-slide-jump="${idx}"
            class="text-left p-3.5 rounded-xl border transition cursor-pointer ${
              idx === currentIndex
                ? 'bg-amber-500/15 border-amber-400/60 text-white'
                : 'bg-slate-800/60 border-slate-700/70 hover:bg-slate-800 text-slate-200'
            }"
          >
            <p class="text-[11px] text-slate-400 font-medium">${s.badge}</p>
            <p class="text-sm font-bold mt-0.5 line-clamp-1">${s.title}</p>
          </button>
        `
        )
        .join('');

      overviewGridEl.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentIndex = Number(btn.dataset.slideJump);
          overviewPanelEl.classList.add('hidden');
          renderSlide(currentIndex);
        });
      });
    }

    // Event listeners
    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderSlide(currentIndex);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < slides.length - 1) {
        currentIndex += 1;
        renderSlide(currentIndex);
      }
    });

    overviewToggleBtn.addEventListener('click', () => {
      renderOverviewGrid();
      overviewPanelEl.classList.toggle('hidden');
    });

    closeOverviewBtn.addEventListener('click', () => {
      overviewPanelEl.classList.add('hidden');
    });

    credentialFooterLink.addEventListener('click', (e) => {
      e.preventDefault();
      if (window.location.hash !== '#credential') {
        history.replaceState(null, '', '#credential');
      }
      openCredentialSlide();
    });

    window.addEventListener('hashchange', () => {
      if (window.location.hash === '#credential') {
        openCredentialSlide();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        if (currentIndex < slides.length - 1) {
          e.preventDefault();
          currentIndex += 1;
          renderSlide(currentIndex);
        }
      } else if (e.key === 'ArrowLeft') {
        if (currentIndex > 0) {
          e.preventDefault();
          currentIndex -= 1;
          renderSlide(currentIndex);
        }
      }
    });

    // Initial render (supports direct #credential jump)
    if (window.location.hash === '#credential') {
      currentIndex = getLastSlideIndex();
    }
    renderSlide(currentIndex);
  </script>
</body>
</html>
